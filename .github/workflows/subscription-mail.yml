name: LevyQuant Subscription and Administrator Mail

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '17 * * * *'
      timezone: UTC

permissions: {}

concurrency:
  group: levyquant-delivery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  confirmations:
    name: Deliver queued subscription confirmations and administrator codes
    if: >-
      ${{ github.repository == 'Rexmiao/levyquant-digest' &&
          github.repository_owner == 'Rexmiao' &&
          github.event.repository.fork == false &&
          ((github.event_name == 'workflow_dispatch' && github.actor == 'Rexmiao') ||
           github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SUBSCRIPTIONS_ENABLED: ${{ vars.SUBSCRIPTIONS_ENABLED }}
      # This switch controls subscription confirmations only. Allowlisted
      # administrator sign-in codes use the same reserved mail worker independently.
      DIGEST_PUBLIC_BASE_URL: ${{ vars.DIGEST_PUBLIC_BASE_URL }}
    steps:
      - name: Validate personal repository scope
        env:
          REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != 'Rexmiao/levyquant-digest' ||
                "$GITHUB_REPOSITORY_OWNER" != 'Rexmiao' ||
                "$REPOSITORY_IS_FORK" != 'false' ]]; then
            printf '%s\n' '::error::This worker is restricted to the original personal repository.'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_ACTOR" != 'Rexmiao' ]]; then
            printf '%s\n' '::error::Only the repository owner may dispatch this worker.'
            exit 1
          fi
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install pinned cloud dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Deliver reserved subscription links and administrator codes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          # Amazon SES (off unless the MAIL_TRANSPORT variable is "ses"; Gmail otherwise).
          MAIL_TRANSPORT: ${{ vars.MAIL_TRANSPORT }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          SES_SMTP_HOST: ${{ vars.SES_SMTP_HOST }}
          SES_SMTP_USERNAME: ${{ secrets.SES_SMTP_USERNAME }}
          SES_SMTP_PASSWORD: ${{ secrets.SES_SMTP_PASSWORD }}
        run: python -m levyquant.subscription_mail
