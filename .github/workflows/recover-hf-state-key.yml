# Temporary owner-only synchronization of the existing authenticated state key.
name: LevyQuant Sync Existing State Key to HF

"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: levyquant-state-key-recovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync-existing-key:
    if: >-
      ${{ github.repository == 'Rexmiao/levyquant-digest' &&
          github.repository_owner == 'Rexmiao' &&
          github.actor == 'Rexmiao' &&
          github.event.repository.fork == false &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install the existing reviewed encryption dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
      - name: Authenticate existing production marker, then sync only its existing key
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          HF_BOOTSTRAP_TOKEN: ${{ secrets.HF_BOOTSTRAP_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          REPOSITORY = 'Rexmiao/levyquant-digest'
          BRANCH = 'delivery-state'
          MARKER = '_state.json'
          FORMAT = 'levyquant-state-aesgcm-v1'
          GITHUB_BASE = 'https://api.github.com/repos/' + REPOSITORY
          REF_URL = GITHUB_BASE + '/git/ref/heads/' + BRANCH
          HF_URL = 'https://huggingface.co/api/spaces/Rexymiao/levyquant-digest/secrets'
          MAX_BYTES = 1024 * 1024

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())
          stage = 'scope_guard'
          post_started = False
          http_status = None
          try:
              if (os.environ.get('GITHUB_REPOSITORY') != REPOSITORY
                      or os.environ.get('GITHUB_REPOSITORY_OWNER') != 'Rexmiao'
                      or os.environ.get('GITHUB_ACTOR') != 'Rexmiao'
                      or os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch'
                      or os.environ.get('GITHUB_REF') != 'refs/heads/main'):
                  raise ValueError
              encoded_key = os.environ.get('STATE_ENCRYPTION_KEY', '')
              hf_token = os.environ.get('HF_BOOTSTRAP_TOKEN', '')
              gh_token = os.environ.get('GITHUB_TOKEN', '')
              if (not re.fullmatch(r'[A-Za-z0-9_-]{43}=?', encoded_key)
                      or not re.fullmatch(r'hf_[A-Za-z0-9_-]{16,250}', hf_token)
                      or not gh_token):
                  raise ValueError
              key = base64.b64decode(encoded_key + '=' * (-len(encoded_key) % 4),
                                     altchars=b'-_', validate=True)
              if (len(key) != 32 or base64.urlsafe_b64encode(key).decode().rstrip('=')
                      != encoded_key.rstrip('=')):
                  raise ValueError

              def get_json(url):
                  request = Request(url, method='GET', headers={
                      'Authorization': 'Bearer ' + gh_token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'LevyQuant-state-key-recovery'})
                  with opener.open(request, timeout=30) as response:
                      if response.status != 200 or response.geturl() != url:
                          raise ValueError
                      raw = response.read(MAX_BYTES + 1)
                  if len(raw) > MAX_BYTES:
                      raise ValueError
                  value = json.loads(raw)
                  if not isinstance(value, dict):
                      raise ValueError
                  return value

              stage = 'read_production_ref'
              ref = get_json(REF_URL)
              head = ref.get('object', {}).get('sha')
              if (ref.get('ref') != 'refs/heads/' + BRANCH
                      or ref.get('object', {}).get('type') != 'commit'
                      or not isinstance(head, str) or not re.fullmatch(r'[a-f0-9]{40}', head)):
                  raise ValueError

              # Read the marker at the existing exact commit, never create a
              # ref/marker and never call ensure_state_branch or any write API.
              stage = 'authenticate_production_marker'
              marker = get_json(GITHUB_BASE + '/contents/' + MARKER + '?ref=' + head)
              if (marker.get('type') != 'file' or marker.get('path') != MARKER
                      or marker.get('encoding') != 'base64' or not isinstance(marker.get('content'), str)):
                  raise ValueError
              content = base64.b64decode(''.join(marker['content'].split()), validate=True)
              envelope = json.loads(content)
              if not isinstance(envelope, dict) or set(envelope) != {'format', 'nonce', 'ciphertext'} or envelope['format'] != FORMAT:
                  raise ValueError
              nonce = base64.b64decode(envelope['nonce'], validate=True)
              ciphertext = base64.b64decode(envelope['ciphertext'], validate=True)
              if len(nonce) != 12 or len(ciphertext) < 16:
                  raise ValueError
              aad = json.dumps([FORMAT, REPOSITORY.casefold(), BRANCH, MARKER],
                               separators=(',', ':')).encode('utf-8')
              plaintext = AESGCM(key).decrypt(nonce, ciphertext, aad)
              if json.loads(plaintext) != {'schema_version': 1, 'encrypted_state': True}:
                  raise ValueError

              # Only after successful production authentication, write this
              # same existing Secret value to this one fixed HF Space.
              stage = 'sync_hf_state_secret'
              request = Request(HF_URL, method='POST', data=json.dumps({
                  'key': 'STATE_ENCRYPTION_KEY', 'value': encoded_key}).encode('utf-8'), headers={
                  'Authorization': 'Bearer ' + hf_token, 'Content-Type': 'application/json',
                  'User-Agent': 'LevyQuant-state-key-recovery'})
              post_started = True
              with opener.open(request, timeout=30) as response:
                  if not 200 <= response.status < 300 or response.geturl() != HF_URL:
                      raise ValueError
                  # Do not read a write response: it can include secret values.
              result = {'status': 'hf_state_key_sync_accepted_restart_pending',
                        'production_marker': 'authenticated', 'state_branch_commit': head,
                        'updated_secret': 'STATE_ENCRYPTION_KEY'}
              exit_code = 0
          except Exception as error:
              if isinstance(error, HTTPError):
                  http_status = error.code if type(error.code) is int else None
                  error.close()  # No response body or exception text is read.
              result = {'status': 'state_key_recovery_failed', 'stage': stage,
                        'error_type': type(error).__name__,
                        'write_outcome_uncertain': post_started and (http_status is None or http_status >= 500 or 300 <= http_status < 400)}
              if http_status is not None:
                  result['http_status'] = http_status
              exit_code = 1
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(exit_code)
          PY
